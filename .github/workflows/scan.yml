name: Refresh scan

on:
  schedule:
    - cron: "30 11 * * 1-5"   # 17:00 IST on weekdays, after the NSE close
    - cron: "30 3 * * 6"      # Saturday morning IST, safety re-run
  workflow_dispatch:
  push:                       # re-run when the scanner itself changes (data commits don't match)
    paths:
      - "scanner/**"
      - "requirements.txt"
      - ".github/workflows/scan.yml"

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scanner/scan.py
      - name: Commit updated data
        run: |
          git config user.name "scan-bot"
          git config user.email "scan-bot@users.noreply.github.com"
          git add data/scan.json
          git diff --cached --quiet || git commit -m "Update scan data"
          git push
